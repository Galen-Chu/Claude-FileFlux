# FileFlux containerized deployment.
#
# Quick start:
#   1. cp .env.template .env  (set DJANGO_SECRET_KEY to a strong random value)
#   2. docker compose up --build
#   3. open http://localhost:8000/ and register a user
#
# With MinIO as a local S3-compatible backend, uncomment the minio service
# below and set in .env:
#   AWS_ACCESS_KEY=minioadmin
#   AWS_SECRET_KEY=minioadmin
#   BUCKET_NAME=fileflux
#   S3_ENDPOINT_URL=http://minio:9000
# then create the bucket once:
#   docker compose run --rm web python -c "\
#     from manager.services import get_s3_storage; \
#     s=get_s3_storage(); \
#     s.client.create_bucket(Bucket='fileflux')"
# (or via the MinIO console at http://localhost:9001)

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Never run the containerized app with DEBUG on
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      # SQLite lives on a mounted volume so it survives rebuilds
      - DB_PATH=/app/data/db.sqlite3
    volumes:
      - fileflux-data:/app/data
      - fileflux-storage:/app/storage

  # Optional local S3-compatible storage (uncomment to use)
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - minio-data:/data
  #   restart: unless-stopped

volumes:
  fileflux-data:
  fileflux-storage:
  # minio-data:
